name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --project-name techno_point --org com.technopoint
      - name: Arrange files
        run: |
          mkdir -p lib assets
          mv -f main.dart lib/main.dart
          mv -f icon.png assets/icon.png
      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="Techno-Point"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Techno-Point-apk
          path: build/app/outputs/flutter-apk/app-release.apk
